{% extends 'base.html' %}
{% load static %}
{% block extra_styles %}
  <link rel="stylesheet" href="{% static 'styles/product_form.css' %}">
{% endblock %}

{% block content %}
  <div class="form-container">
    <h2>➕ Add New Product</h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Add Product</button>
    </form>
  </div>
{% endblock %}
